server:
  port: ${PORT:8080}

spring:
  application:
    name: wallet

  # Supabase (Postgres). Los valores reales van por variables de entorno.
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  # JPA no crea tablas: de eso se encarga Flyway.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Flyway busca las migraciones en db/migration.
  flyway:
    enabled: true

  # kafka
  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${REDPANDA_USER}"
        password="${REDPANDA_PASSWORD}";
    # Productor: la clave como texto, el valor como JSON.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # Consumidor: la clave como texto, el valor como JSON.
    # Envueltos en ErrorHandlingDeserializer: si el payload no se puede
    # deserializar (poison pill), el fallo llega como una excepción normal al
    # DefaultErrorHandler (que ya sabe mandarlo a la DLQ), en vez de tumbar el
    # container del consumer directamente en el poll().
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.geovannycode.wallet.*"
        # Ignoramos el header __TypeId__ (el tipo Java que puso el productor al
        # serializar) y forzamos siempre este tipo: es el único evento que viaja
        # por wallet.movements, y así el consumidor no depende de qué clase haya
        # usado el productor para serializar cada mensaje.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.geovannycode.wallet.movement.domain.MovimientoRegistrado

    listener:
      # Sin esto, un AuthorizationException (ACL/topic no listo aún) apaga el
      # container para siempre. Con esto, reintenta cada 10s hasta que la ACL
      # o el tópico existan, en vez de dejar los consumers muertos.
      auth-exception-retry-interval: 10s

# Flags de demo para el taller. No usar en producción.
wallet:
  demo:
    dlq-sentinel-enabled: ${WALLET_DEMO_DLQ_SENTINEL:false}

  mail:
    from: ${MAIL_FROM:wallet@localhost}
    ops-to: ${MAIL_OPS_TO:ops@localhost}
    # API HTTP de Resend (no SMTP): Render bloquea los puertos SMTP salientes
    # (25/465/587) en el plan Free. Ver ResendMailPort.
    resend-api-key: ${RESEND_API_KEY}