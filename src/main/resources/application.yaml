server:
  port: ${PORT:8080}

spring:
  application:
    name: wallet

  # Supabase (Postgres). Los valores reales van por variables de entorno.
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  # JPA no crea tablas: de eso se encarga Flyway.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Flyway busca las migraciones en db/migration.
  flyway:
    enabled: true

  # kafka
  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${REDPANDA_USER}"
        password="${REDPANDA_PASSWORD}";
    # Productor: la clave como texto, el valor como JSON.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # Consumidor: la clave como texto, el valor como JSON.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.geovannycode.wallet.*"

    listener:
      # Sin esto, un AuthorizationException (ACL/topic no listo aún) apaga el
      # container para siempre. Con esto, reintenta cada 10s hasta que la ACL
      # o el tópico existan, en vez de dejar los consumers muertos.
      auth-exception-retry-interval: 10s

  # Mail
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

# Flags de demo para el taller. No usar en producción.
wallet:
  demo:
    dlq-sentinel-enabled: ${WALLET_DEMO_DLQ_SENTINEL:false}

  mail:
    from: ${MAIL_FROM:wallet@localhost}
    ops-to: ${MAIL_OPS_TO:ops@localhost}