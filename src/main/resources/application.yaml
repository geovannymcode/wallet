spring:
  application:
    name: wallet

  # Supabase (Postgres). Los valores reales van por variables de entorno.
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  # JPA no crea tablas: de eso se encarga Flyway.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Flyway busca las migraciones en db/migration.
  flyway:
    enabled: true

  # kafka
  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${REDPANDA_USER}"
        password="${REDPANDA_PASSWORD}";
    # Productor: la clave como texto, el valor como JSON.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # Consumidor: la clave como texto, el valor como JSON.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.geovannycode.wallet.*"

  # Mail
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false